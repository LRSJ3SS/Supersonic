<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0B0420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dance Next Now · Controle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FF3CAC'/%3E%3Cpath d='M20 14h12c11 0 18 7 18 18s-7 18-18 18H20z' fill='%23fff'/%3E%3Cpath d='M28 22v20h4c6 0 10-4 10-10s-4-10-10-10z' fill='%23FF3CAC'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,600;0,800;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/controller.css">
</head>
<body class="ctl">
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

  <!-- entrar -->
  <main id="join" class="cview">
    <div class="logo small"><b>DANCE</b><i>NEXT NOW</i></div>
    <p class="dim center">Seu celular vira o controle. Abra o Dance Next Now no computador e digite o código da sala.</p>
    <label class="field"><span>Código da sala</span><input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE"></label>
    <label class="field"><span>Seu nome</span><input id="name" maxlength="16" autocomplete="nickname" placeholder="Dançarino"></label>
    <button id="joinBtn" class="btn pink big">ENTRAR</button>
    <p id="joinMsg" class="msg"></p>
  </main>

  <!-- conectado -->
  <main id="room" class="cview" hidden>
    <header class="me">
      <span id="meBadge" class="me-badge">P1</span>
      <div><b id="meName"></b><small id="meRoom"></small></div>
      <span id="link" class="link-dot" title="conexão"></span>
    </header>

    <!-- lobby / escolha -->
    <section id="vLobby" class="pane">
      <p id="lobbyMsg" class="status">Escolha a música na tela</p>
      <div class="pad">
        <button data-k="up" class="pk up" aria-label="Cima">▲</button>
        <button data-k="left" class="pk left" aria-label="Esquerda">◀</button>
        <button data-k="ok" class="pk ok">OK</button>
        <button data-k="right" class="pk right" aria-label="Direita">▶</button>
        <button data-k="down" class="pk down" aria-label="Baixo">▼</button>
      </div>
      <button data-k="back" class="btn ghost">Voltar</button>
      <div class="sensor"><span>Sensor</span><div class="meter"><div id="meter"></div></div><small id="sensorMsg">mexa o celular</small></div>
    </section>

    <!-- carregando -->
    <section id="vLoading" class="pane" hidden>
      <div class="spinner"></div>
      <p class="status" id="loadingMsg">Preparando a música...</p>
      <p class="tip">Segure o celular na <b>mão direita</b>, com a tela virada para você.</p>
    </section>

    <!-- dançando -->
    <section id="vPlay" class="pane play" hidden>
      <p id="playSong" class="song"></p>
      <p id="playCoach" class="coach"></p>
      <div id="fb" class="fb"></div>
      <div id="combo" class="combo-c"></div>
      <div class="score-c"><span id="score">0</span><small>pontos</small></div>
      <button data-k="back" class="btn ghost pause-c">Pausar</button>
    </section>

    <!-- pausado -->
    <section id="vPaused" class="pane" hidden>
      <p class="status big">Pausado</p>
      <button data-k="ok" class="btn pink big">CONTINUAR</button>
    </section>

    <!-- resultado -->
    <section id="vResult" class="pane" hidden>
      <p id="rRank" class="rank"></p>
      <div id="rScore" class="score-c big"></div>
      <div id="rStars" class="stars big"></div>
      <p id="rRecord" class="record"></p>
      <p id="rCounts" class="counts"></p>
      <button data-k="ok" class="btn pink big">DANÇAR DE NOVO</button>
      <button data-k="back" class="btn purple">OUTRA MÚSICA</button>
    </section>
  </main>

  <script src="js/vendor/peerjs.min.js"></script>
  <script type="module" src="js/controller.js"></script>
</body>
</html>
